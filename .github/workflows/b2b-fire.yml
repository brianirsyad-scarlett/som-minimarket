name: SAT + MIDI Sell Out - request + verify (draft)

# Requests the by-store (3 rolling 10-day periods) and by-branch (current +
# previous month) sell-out exports, then verifies 10 minutes later. The portal
# emails a link per report; b2b-collect.yml downloads them at 08:05 and 09:05.
#
# Fire and verify are steps of ONE job with a fixed 10-minute wait between,
# not two schedules: GitHub often starts scheduled runs late, and a separate
# 07:10 verify could then run BEFORE a late 07:00 fire. The verify only means
# something inside the portal's 1-hour cooldown, and this keeps it there.
#
# 07:05, not 07:00: the top of the hour - and 00:00 UTC above all - is GitHub's
# busiest scheduling minute, when runs are delayed most and can be dropped.
#
# This is the ONLY fire. The laptop's B2B_Fire_0700 / B2B_Verify_0710 /
# B2B_Collect_Morning were disabled on 2026-09-24 when this took over.
on:
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * *"     # 07:05 WIB

concurrency:
  group: b2b-fire
  cancel-in-progress: false

env:
  TZ: Asia/Jakarta
  PYTHONIOENCODING: utf-8

jobs:
  fire-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # One login per chain covers market share and B2B (verified on the laptop).
      ALFAMART_B2B_USER: ${{ secrets.ALFAMART_USERNAME }}
      ALFAMART_B2B_PASS: ${{ secrets.ALFAMART_PASSWORD }}
      ALFAMART_TOTP_SECRET: ${{ secrets.ALFAMART_TOTP_SECRET }}
      B2B_MIDI_USER: ${{ secrets.ALFAMIDI_USERNAME }}
      B2B_MIDI_PASS: ${{ secrets.ALFAMIDI_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fire - Alfamart
        run: python -u fire_b2b.py --brand alfamart

      # !cancelled(): a failed fire must not skip the rest - the verify is
      # exactly what heals a fire that missed requests.
      - name: Fire - Alfamidi
        if: ${{ !cancelled() }}
        run: python -u fire_b2b.py --brand alfamidi

      - name: Wait 10 minutes (verify must land inside the 1-hour cooldown)
        if: ${{ !cancelled() }}
        run: sleep 600

      - name: Verify - Alfamart
        if: ${{ !cancelled() }}
        run: python -u fire_b2b.py --brand alfamart --verify

      - name: Verify - Alfamidi
        if: ${{ !cancelled() }}
        run: python -u fire_b2b.py --brand alfamidi --verify
