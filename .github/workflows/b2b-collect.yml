name: SAT + MIDI Sell Out - collect (draft)

# Power Automate turns every report email into an issue titled "B2B|<brand>|...".
# This drains those issues: download each link, upload it to the draft bucket,
# close the issue. Issues cost no Actions minutes, so a day's ~120-250 emails
# become 2 short runs instead of one run per email.
#
# The 07:05 fire's emails land roughly 10-65 min later, so 08:05 should catch
# most and 09:05 is the backstop. The 09:05 slot also FAILS if a brand had no
# email at all today - a broken flow must not look like a quiet mailbox.
# (+5 min past the hour for the same reason as the fire: the top of the hour is
# GitHub's most congested scheduling minute.)
on:
  workflow_dispatch:
    inputs:
      expect_today:
        description: "Fail if a brand had no report email today"
        type: boolean
        default: false
  schedule:
    - cron: "5 1 * * *"     # 08:05 WIB
    - cron: "5 2 * * *"     # 09:05 WIB - last slot, --expect-today

permissions:
  contents: read
  issues: write

concurrency:
  group: b2b-collect
  cancel-in-progress: false

env:
  TZ: Asia/Jakarta
  PYTHONIOENCODING: utf-8
  GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp_key.json

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write GCS credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: printf '%s' "$GCP_SA_KEY" > gcp_key.json

      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=()
          [ "${{ github.event.schedule }}" = "5 2 * * *" ] && args+=(--expect-today)
          [ "${{ inputs.expect_today }}" = "true" ] && args+=(--expect-today)
          python -u collect_b2b.py "${args[@]}"
